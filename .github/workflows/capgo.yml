name: Capgo

on:
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "ios/**"
      - "resources/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/capgo.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "android/**"
      - "ios/**"
      - "resources/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/capgo.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: Capgo channel.
        required: true
        default: production
        type: string
      release_target:
        description: Auto-detect, force live update, or force native build.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - ota
          - native
      native_platform:
        description: Native platform when a native build is requested.
        required: true
        default: both
        type: choice
        options:
          - android
          - ios
          - both

permissions:
  contents: read

concurrency:
  group: capgo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPGO_APP_ID: ee.forgr.festivalscan
  CAPGO_CHANNEL: ${{ github.event.inputs.channel || 'production' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  detect-release:
    name: Detect native build need
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    outputs:
      native_build_needed: ${{ steps.release-check.outputs.native_build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check if native build is required
        id: release-check
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          : "${CAPGO_TOKEN:?Missing CAPGO_TOKEN secret}"
          set +e
          bunx @capgo/cli@latest build needed --channel "$CAPGO_CHANNEL"
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "native_build_needed=false" >> "$GITHUB_OUTPUT"
            echo "Release type: live update"
          elif [ "$exit_code" -eq 1 ]; then
            echo "native_build_needed=true" >> "$GITHUB_OUTPUT"
            echo "Release type: native build"
          else
            echo "Capgo build-needed check failed with exit code $exit_code" >&2
            exit "$exit_code"
          fi

  capgo-live-update:
    name: Upload live update
    runs-on: ubuntu-latest
    needs:
      - checks
      - detect-release
    if: >
      github.event_name != 'pull_request' &&
      ((github.event.inputs.release_target || 'auto') == 'ota' ||
        ((github.event.inputs.release_target || 'auto') == 'auto' && needs.detect-release.outputs.native_build_needed == 'false'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build mobile app
        run: bun run build

      - name: Upload Capgo bundle
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          : "${CAPGO_TOKEN:?Missing CAPGO_TOKEN secret}"
          bunx @capgo/cli@latest bundle upload --channel "$CAPGO_CHANNEL" --delta

  capgo-android-build:
    name: Android native build
    runs-on: ubuntu-latest
    needs:
      - checks
      - detect-release
    if: >
      github.event_name != 'pull_request' &&
      ((github.event.inputs.release_target || 'auto') == 'native' ||
        ((github.event.inputs.release_target || 'auto') == 'auto' && needs.detect-release.outputs.native_build_needed == 'true')) &&
      ((github.event.inputs.native_platform || 'both') == 'android' || (github.event.inputs.native_platform || 'both') == 'both')
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare Android project
        run: |
          bun run build
          bunx cap sync android

      - name: Request Android build through Capgo CLI
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          BUILD_OUTPUT_UPLOAD_ENABLED: "true"
          BUILD_OUTPUT_RETENTION_SECONDS: "604800"
        run: bunx @capgo/cli@latest build request --platform android --path . --ai-analytics

  capgo-ios-build:
    name: iOS native build
    runs-on: ubuntu-latest
    needs:
      - checks
      - detect-release
    if: >
      github.event_name != 'pull_request' &&
      ((github.event.inputs.release_target || 'auto') == 'native' ||
        ((github.event.inputs.release_target || 'auto') == 'auto' && needs.detect-release.outputs.native_build_needed == 'true')) &&
      ((github.event.inputs.native_platform || 'both') == 'ios' || (github.event.inputs.native_platform || 'both') == 'both')
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=hoisted

      - name: Prepare iOS project
        run: |
          bun run build
          bunx cap sync ios

      - name: Request iOS build through Capgo CLI
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CAPGO_IOS_PROVISIONING_MAP_BASE64: ${{ secrets.CAPGO_IOS_PROVISIONING_MAP_BASE64 || secrets.CAPGO_IOS_PROVISIONING_MAP }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_OUTPUT_UPLOAD_ENABLED: "true"
          BUILD_OUTPUT_RETENTION_SECONDS: "604800"
        run: bunx @capgo/cli@latest build request --platform ios --path . --ai-analytics
